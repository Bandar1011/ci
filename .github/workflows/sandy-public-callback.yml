name: macOS validation completion

on:
  workflow_run:
    workflows: [macOS validation]
    types: [completed]

permissions:
  contents: read

jobs:
  relay:
    if: github.repository == 'Bandar1011/ci' && github.repository_id == '1423816626' && github.event.workflow_run.event == 'repository_dispatch' && github.event.workflow_run.run_attempt == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate completion before authentication
        id: validate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          SANDY_PUBLIC_CI_WORKFLOW_ID: ${{ vars.SANDY_PUBLIC_CI_WORKFLOW_ID }}
          SANDY_CALLBACK_ISSUE_NUMBER: ${{ vars.SANDY_CALLBACK_ISSUE_NUMBER }}
        with:
          script: |
            const RUN_ID = /^[1-9][0-9]{0,19}$/;
            const fail = (message) => { throw new Error(`Callback validation failed: ${message}`); };
            if (process.env.RUNNER_DEBUG === '1' || process.env.ACTIONS_STEP_DEBUG === 'true' || process.env.GITHUB_RUN_ATTEMPT !== '1') fail('debug or rerun');
            if (context.repo.owner !== 'Bandar1011' || context.repo.repo !== 'ci' || context.payload.repository?.id !== 1423816626) fail('public repository');
            const run = context.payload.workflow_run;
            if (!run || ![
              '.github/workflows/sandy-public-macos.yml',
              '.github/workflows/sandy-public-macos.yml@main',
            ].includes(run.path)) fail('workflow path');
            const workflowId = process.env.SANDY_PUBLIC_CI_WORKFLOW_ID || '';
            if (!RUN_ID.test(workflowId) || String(run.workflow_id) !== workflowId) fail('workflow identity');
            if (run.event !== 'repository_dispatch' || run.status !== 'completed') fail('trigger event or status');
            if (run.run_attempt !== 1) fail('run attempt');
            const match = /^sandy-public-ci-([0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})-([1-9][0-9]{0,19})$/.exec(run.display_title || '');
            if (!match) fail('display title binding');
            if (!RUN_ID.test(String(run.id))) fail('public run ID');
            if (!RUN_ID.test(process.env.SANDY_CALLBACK_ISSUE_NUMBER || '')) fail('relay configuration');
            const current = await github.rest.repos.getBranch({ owner: context.repo.owner, repo: context.repo.repo, branch: 'main' });
            if (!/^[0-9a-f]{40}$/.test(run.head_sha || '') || !/^[0-9a-f]{40}$/.test(current.data.commit.sha || '')) fail('invalid workflow SHA');
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner, repo: context.repo.repo,
              basehead: `${run.head_sha}...${current.data.commit.sha}`,
            });
            if (!['ahead', 'identical'].includes(comparison.data.status)) fail('workflow SHA is not on current main history');
            core.setOutput('request-id', match[1]);
            core.setOutput('request-run-id', match[2]);
            core.setOutput('public-run-id', String(run.id));
      - name: Mint scoped callback writer
        id: callback-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.SANDY_CALLBACK_APP_ID }}
          private-key: ${{ secrets.SANDY_CALLBACK_APP_PRIVATE_KEY }}
          owner: Bandar1011
          repositories: ${{ secrets.SANDY_SOURCE_REPOSITORY }}
          permission-issues: write
      - name: Relay completion IDs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          SANDY_REQUEST_ID: ${{ steps.validate.outputs.request-id }}
          SANDY_REQUEST_RUN_ID: ${{ steps.validate.outputs.request-run-id }}
          SANDY_PUBLIC_RUN_ID: ${{ steps.validate.outputs.public-run-id }}
          SANDY_PRIVATE_REPOSITORY_ID: ${{ secrets.SANDY_PRIVATE_REPOSITORY_ID }}
          SANDY_SOURCE_REPOSITORY: ${{ secrets.SANDY_SOURCE_REPOSITORY }}
          SANDY_CALLBACK_ISSUE_NUMBER: ${{ vars.SANDY_CALLBACK_ISSUE_NUMBER }}
        with:
          github-token: ${{ steps.callback-token.outputs.token }}
          script: |
            const fail = (message) => { throw new Error(`Callback relay failed: ${message}`); };
            const repositoryId = process.env.SANDY_PRIVATE_REPOSITORY_ID || '';
            const repositoryName = process.env.SANDY_SOURCE_REPOSITORY || '';
            if (!/^[1-9][0-9]{0,19}$/.test(repositoryId) || !Number.isSafeInteger(Number(repositoryId)) || !/^[A-Za-z0-9_.-]+$/.test(repositoryName)) fail('private repository configuration');
            const repository = await github.request('GET /repositories/{repository_id}', { repository_id: Number(repositoryId) });
            if (String(repository.data.id) !== repositoryId || repository.data.full_name !== `Bandar1011/${repositoryName}` || repository.data.private !== true) fail('private repository identity');
            const issueNumber = process.env.SANDY_CALLBACK_ISSUE_NUMBER || '';
            if (!/^[1-9][0-9]{0,19}$/.test(issueNumber) || !Number.isSafeInteger(Number(issueNumber))) fail('relay issue');
            const target = { owner: 'Bandar1011', repo: repositoryName, issue_number: Number(issueNumber) };
            const issue = await github.rest.issues.get(target);
            if (String(issue.data.number) !== issueNumber || issue.data.pull_request) fail('relay issue identity');
            const body = JSON.stringify({
              request_id: process.env.SANDY_REQUEST_ID,
              request_run_id: process.env.SANDY_REQUEST_RUN_ID,
              public_run_id: process.env.SANDY_PUBLIC_RUN_ID,
            });
            await github.rest.issues.createComment({ ...target, body });
